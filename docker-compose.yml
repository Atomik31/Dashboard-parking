# Déploiement auto-hébergé (VPS) : construit l'image depuis ce dépôt GitHub.
# Le trafic entre par le Traefik du VPS (network_mode: host), qui découvre le
# conteneur via les labels, route https://parking-aixpress.fr vers son port
# 8501 et obtient le certificat Let's Encrypt (résolveur `letsencrypt`).
# Les variables AWS donnent l'accès en lecture à l'historique S3 (voir README,
# section Historique S3) ; sans elles le dashboard tourne, historique vide.
services:
  parking-dashboard:
    build:
      context: https://github.com/Atomik31/Dashboard-parking.git#main
    container_name: parking-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.parking-dashboard.rule=Host(`parking-aixpress.fr`) || Host(`www.parking-aixpress.fr`)
      - traefik.http.routers.parking-dashboard.entrypoints=websecure
      - traefik.http.routers.parking-dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.parking-dashboard.loadbalancer.server.port=8501
