name: Déployer sur le Space Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pousser vers le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Instantané sans historique (commit orphelin) : HF rejette les binaires
          # présents dans l'historique git (fontes .ttf de V2/, non nécessaires au Space).
          rm -rf V2
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://Atomik31:${HF_TOKEN}@huggingface.co/spaces/Atomik31/dashboard-parking-aix" \
            deploy:main
