name: Déployer sur le Space Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet requis : un push git refuse un historique tronqué
          fetch-depth: 0

      - name: Pousser vers le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://Atomik31:${HF_TOKEN}@huggingface.co/spaces/Atomik31/dashboard-parking-aix" \
            HEAD:main
