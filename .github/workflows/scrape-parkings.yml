name: Scrape parkings

on:
  schedule:
    # Deux déclenchements par heure, à des minutes décalées : les crons alignés
    # (:00, :10, ...) sont les plus concurrencés et souvent sautés par GitHub.
    # Chaque run prend ensuite 3 relevés espacés de ~10 min (voir NB_RELEVES),
    # ce qui maintient la cadence de 10 min avec 3x moins de déclenchements.
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-parkings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 3 relevés par run planifié ; 1 seul pour un lancement manuel (test rapide)
      NB_RELEVES: ${{ github.event_name == 'schedule' && 3 || 1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install requests boto3

      - name: Scraper et archiver vers S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          for i in $(seq 1 "$NB_RELEVES"); do
            python -m scripts.scrape_to_s3
            if [ "$i" -lt "$NB_RELEVES" ]; then
              echo "⏳ Prochain relevé dans ~10 minutes ($i/$NB_RELEVES faits)..."
              sleep 570
            fi
          done
